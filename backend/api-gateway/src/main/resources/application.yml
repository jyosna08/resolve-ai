spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-team-service
          uri: lb://auth-team-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: ticket-workflow-service
          uri: lb://ticket-workflow-service
          predicates:
            - Path=/api/tickets/**
        - id: ai-triage-service
          uri: lb://ai-triage-service
          predicates:
            - Path=/api/ai/**
        - id: notification-sla-service
          uri: lb://notification-sla-service
          predicates:
            - Path=/api/notifications/**
server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
management:
  endpoints:
    web:
      exposure:
        include: health,info
