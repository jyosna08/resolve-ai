spring:
  application:
    name: ticket-workflow-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticket_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 20000
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
server:
  port: 8082
app:
  jwt:
    secret: ${JWT_SECRET:resolveai-local-development-secret-change-before-prod-2026}
  sla:
    hours: ${SLA_HOURS:24}
    warning-minutes: ${SLA_WARNING_MINUTES:120}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
