spring:
  datasource:
    url: jdbc:h2:mem:ticket_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
app:
  jwt:
    secret: ticket-workflow-test-jwt-secret-32-bytes-minimum
  sla:
    hours: 24
    warning-minutes: 120
