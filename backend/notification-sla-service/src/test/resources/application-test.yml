spring:
  datasource:
    url: jdbc:h2:mem:notif_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
app:
  jwt:
    secret: notification-test-jwt-secret-32-bytes-minimum
  rabbitmq:
    enabled: false
  sla:
    scheduler-enabled: false
    check-interval-ms: 60000
